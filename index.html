<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Elcio Júnior</title>
  <meta name="description" content="Elcio Júnior, engenheiro de software full-stack com .NET, Angular e IA aplicada.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>
    try {
      var t = localStorage.getItem('theme');
      if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
</head>
<body>
  <div class="rays" aria-hidden="true"></div>
  <div class="code-bg" aria-hidden="true" id="codeBg"></div>

  <header class="site-header">
    <a class="brand" href="#top"><span class="diamond"></span>Elcio Júnior</a>
    <nav class="nav" id="nav">
      <a href="#about" data-i18n="nav.about"></a>
      <a href="#stack" data-i18n="nav.stack"></a>
      <a href="#experience" data-i18n="nav.experience"></a>
      <a href="#contact" data-i18n="nav.contact"></a>
    </nav>
    <div class="tools">
      <button id="langBtn" class="icon-btn" aria-label="Language">PT</button>
      <button id="themeBtn" class="icon-btn" aria-label="Theme">◐</button>
    </div>
  </header>

  <main id="top">
    <section class="hero">
      <div class="hero-text">
        <p class="eyebrow"><span class="diamond"></span><span data-i18n="hero.eyebrow"></span></p>
        <h1 data-i18n="hero.name"></h1>
        <p class="role" data-i18n="hero.role"></p>
        <p class="lead" data-i18n="hero.summary"></p>
        <p class="loc" data-i18n="hero.location"></p>
        <div class="cta">
          <a class="btn primary" href="#contact" data-i18n="hero.cta1"></a>
          <a class="btn" href="#experience" data-i18n="hero.cta2"></a>
        </div>
      </div>
      <figure class="arch">
        <div class="arch-inner">
          <img id="avatar" src="assets/profile.png" alt="Ilustração de Elcio Júnior" width="400" height="500">
        </div>
      </figure>
    </section>

    <section id="about" class="section reveal">
      <h2 class="label"><span class="diamond"></span><span data-i18n="about.title"></span></h2>
      <div class="card prose" id="aboutBody"></div>
    </section>

    <section id="stack" class="section reveal">
      <h2 class="label"><span class="diamond"></span><span data-i18n="stack.title"></span></h2>
      <div class="grid" id="stackGrid"></div>
    </section>

    <section id="experience" class="section reveal">
      <h2 class="label"><span class="diamond"></span><span data-i18n="experience.title"></span></h2>
      <div class="timeline" id="expList"></div>
    </section>

    <section id="projects" class="section reveal">
      <h2 class="label"><span class="diamond"></span><span data-i18n="projects.title"></span></h2>
      <div class="grid wide" id="projList"></div>
    </section>

    <section id="education" class="section reveal">
      <h2 class="label"><span class="diamond"></span><span data-i18n="education.title"></span></h2>
      <div class="grid wide" id="eduList"></div>
    </section>

    <section id="contact" class="section reveal">
      <h2 class="label"><span class="diamond"></span><span data-i18n="contact.title"></span></h2>
      <div class="card contact">
        <p data-i18n="contact.text"></p>
        <div class="links" id="links"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <span>© <span id="year"></span> Elcio Júnior</span>
  </footer>

  <script src="js/content.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
